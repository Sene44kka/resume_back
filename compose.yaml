# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_postgres
    environment:
      POSTGRES_DB: my_resume
      POSTGRES_USER: my_resume_admin
      POSTGRES_PASSWORD: my_resume_admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_resume_admin -d my_resume"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - resume-network

  # Если нужен Redis
  redis:
    image: redis:7-alpine
    container_name: resume_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - resume-network

  # Kafka для вашего приложения
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - resume-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - resume-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_PROFILE: docker
    container_name: resume_app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      # Spring профиль
      SPRING_PROFILES_ACTIVE: docker
      
      # База данных
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/my_resume?useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: my_resume_admin
      SPRING_DATASOURCE_PASSWORD: my_resume_admin
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: 20
      
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BROKER: kafka:9092
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_RU_SKRIPOV: DEBUG
      LOGGING_FILE_NAME: /app/logs/application.log
      
      # Security (настройте свои значения)
      JWT_SECRET_KEY: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRATION: 900
      JWT_REFRESH_TOKEN_EXPIRATION: 604800
      
      # Server
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /
      
      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
    networks:
      - resume-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  resume-network:
    driver: bridge